{% extends 'core/base.html' %}
{% load static %}
{% block title %}تعديل وثيقة - نظام الأرشفة{% endblock %}

{% block content %}
<div class="card" style="max-width: 550px; margin: 0 auto;">
    <h2 class="section-title"><i class="fas fa-edit"></i> تعديل الوثيقة</h2>

    <div class="msg msg-info">
        الوثيقة: {{ document.full_number }}
    </div>

    <form method="post" autocomplete="off">
        {% csrf_token %}

        <label for="id_document_number">رقم الوثيقة</label>
        <input type="text" id="id_document_number" name="document_number"
               value="{{ document.document_number }}" required>

        <label for="id_diwan_number">رقم الديوان <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <input type="text" id="id_diwan_number" name="diwan_number"
               value="{{ document.diwan_number|default:'' }}">

        <label for="id_title">اسم الوثيقة</label>
        <input type="text" id="id_title" name="title" value="{{ document.title }}" required>

        <label for="id_document_type">نوع الوثيقة <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <select id="id_document_type" name="document_type_id">
            <option value="">-- اختر النوع --</option>
            {% for dt in document_types %}
            <option value="{{ dt.id }}" {% if document.document_type_id == dt.id %}selected{% endif %}>{{ dt.name }}</option>
            {% endfor %}
        </select>

        <label for="id_document_date">التاريخ</label>
        <input type="date" id="id_document_date" name="document_date" value="{{ document.document_date|date:'Y-m-d' }}" required>

        <label for="id_export_date">تاريخ التصدير/الختم <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <input type="date" id="id_export_date" name="export_date" value="{{ document.export_date|date:'Y-m-d' }}">

        <label for="id_tags">الوسوم <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <input type="text" id="id_tags" name="tags" value="{{ document.tags.all|join:', ' }}" placeholder="مثال: مالية, 2026, عاجل">

        <label for="id_source">المصدر</label>
        <select id="id_source" name="source" data-source-toggle required>
            <option value="internal" {% if document.source == 'internal' %}selected{% endif %}>داخلي</option>
            <option value="external" {% if document.source == 'external' %}selected{% endif %}>خارجي</option>
        </select>

        <div data-source-panel="internal">
            <label for="id_issuing_directorate">المديرية الصادرة عنها</label>
            <select id="id_issuing_directorate" name="issuing_directorate">
                <option value="">اختر المديرية</option>
                {% for d in directorates %}
                <option value="{{ d.id }}" {% if document.issuing_directorate_id == d.id %}selected{% endif %}>{{ d.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div data-source-panel="external">
            <label for="id_external_entity">اسم الجهة الخارجية</label>
            <input type="text" id="id_external_entity" name="external_entity_name"
                   value="{{ document.external_entity_name|default:'' }}" placeholder="مثال: وزارة الداخلية، شركة كذا...">
        </div>

        <label for="id_destination_entity_name">الجهة المحولة إليها <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <input type="text" id="id_destination_entity_name" name="destination_entity_name"
               value="{{ document.destination_entity_name|default:'' }}" placeholder="اكتب اسم الجهة المحولة إليها">

        <!-- ✅✅✅ جديد: حالة الوثيقة ✅✅✅ -->
        <label for="id_status">حالة الوثيقة <span style="display:inline-block; margin-right:6px; padding:2px 8px; font-size:10px; font-weight:600; color:#7b8794; background:#f1f3f2; border:1px solid #dce1df; border-radius:999px;">اختياري</span></label>
        <input type="text" id="id_status" name="status" maxlength="100"
               value="{{ document.status|default:'' }}"
               placeholder="مثال: قيد المراجعة، تم الإنجاز، معلّقة...">

        <button type="submit" class="btn btn-primary btn-block">حفظ التعديلات</button>
        <a href="{% url 'document_detail' document.id %}" class="btn btn-secondary btn-block">إلغاء</a>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'core/js/source_field_toggle.js' %}"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var docDate = document.getElementById('id_document_date');
    var exportDate = document.getElementById('id_export_date');
    if (docDate && exportDate) {
        docDate.addEventListener('change', function() {
            if (!exportDate.value) {
                exportDate.value = docDate.value;
            }
        });
    }
});
</script>
{% endblock %}
